version: 2
release:
  github:
    owner: synthient
    name: 'cli'
  prerelease: auto
before:
  hooks:
    - go mod download
builds:
  - goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
homebrew_casks:
  - name: synthient
    completions:
      bash: completions/synthient.bash
      zsh: completions/synthient.zsh
      fish: completions/synthient.fish
    url:
      template: 'https://github.com/synthient/cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}'
    homepage: https://github.com/synthient/cli
    description: Official CLI for synthient
    zap:
      delete:
        - ~/.config/synthient
    repository:
      owner: synthient
      name: tap
